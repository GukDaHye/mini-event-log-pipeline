services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: commerce_events
      POSTGRES_USER: commerce_user
      POSTGRES_PASSWORD: commerce_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce_user -d commerce_events"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: commerce_events
      DB_USER: commerce_user
      DB_PASSWORD: commerce_password
      OUTPUT_DIR: output
      EVENT_COUNT: 1000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./output:/app/output

volumes:
  pgdata:
